<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XF48R96NXB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XF48R96NXB');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khan Saqib | {{ title }}</title>
    <meta name="description" content="{{ description | default('Saqib Khan — Electrical &amp; Computer Engineer specializing in high-performance computing, GPU validation, and firmware development.') }}">
    <meta property="og:title" content="Khan Saqib | {{ title }}">
    <meta property="og:description" content="{{ description | default('Saqib Khan — Electrical &amp; Computer Engineer specializing in high-performance computing, GPU validation, and firmware development.') }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://khansaqib.com">
    <meta property="og:image" content="https://khansaqib.com/static/img/profile.jpg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Khan Saqib | {{ title }}">
    <meta name="twitter:description" content="{{ description | default('Saqib Khan — Electrical &amp; Computer Engineer specializing in high-performance computing, GPU validation, and firmware development.') }}">
    <meta name="twitter:image" content="https://khansaqib.com/static/img/profile.jpg">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="canonical" href="https://khansaqib.com">
    <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="static/apple-touch-icon.png">
    <link rel="stylesheet" href="static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="logo">SAQIB KHAN</div>
        
        <div class="menu-toggle" id="mobile-menu" role="button" tabindex="0" aria-label="Toggle navigation menu" aria-expanded="false">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <ul class="nav-links">
	    <li><a href="{{ url_for('home') }}" class="{% if title == 'About Me' %}active{% endif %}">About</a></li>
            <li><a href="{{ url_for('projects') }}" class="{% if title == 'Projects' %}active{% endif %}">Projects</a></li>
            <li><a href="{{ url_for('apps') }}" class="{% if title == 'Apps' %}active{% endif %}">Apps</a></li>
            <li><a href="#contact" class="btn-primary">Contact</a></li>
        </ul>
    </nav>

    {% block content %}{% endblock %}

    <footer id="contact">
        <div class="container">
            <h2>Let's build something together.</h2>
            <p>Open for opportunities in software development and technical consulting.</p>
            <a href="mailto:saqibkhan@utexas.edu" class="email-link">saqibkhan@utexas.edu</a>
            <div class="copyright">
                &copy; {{ current_year }} Khan Saqib. All rights reserved.
            </div>
        </div>
    </footer>

    <script>
        const menuToggle = document.getElementById('mobile-menu');
        const navLinks = document.querySelector('.nav-links');

        function toggleMenu() {
            const isOpen = navLinks.classList.toggle('active');
            menuToggle.setAttribute('aria-expanded', isOpen);
        }

        if (menuToggle) {
            menuToggle.addEventListener('click', toggleMenu);
            menuToggle.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleMenu();
                }
            });
        }

        // Close the mobile menu whenever any nav link is tapped
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
                menuToggle.setAttribute('aria-expanded', 'false');
            });
        });
    </script>

</body>
</html>
