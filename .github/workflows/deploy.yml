name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel mid-deploy; queue instead to avoid racing commits to docs/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests with Coverage
        run: pytest tests/ -v --tb=short --cov=app --cov=build --cov-report=term-missing --cov-fail-under=80

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test          # Deploy only if tests pass

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Build Script
        run: python build.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🚀 Auto-build static site [skip ci]"
          file_pattern: 'docs/'
