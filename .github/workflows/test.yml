name: Tests

on:
  push:
    branches-ignore: [main]   # main is already covered by deploy.yml's own test job
  pull_request:
    branches: [main]          # required check before merging
  workflow_dispatch:           # allow manual runs from the Actions tab

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true     # superseded runs on the same branch get cancelled

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=app --cov=build --cov-report=term-missing --cov-fail-under=80
